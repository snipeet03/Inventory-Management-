{% extends "inventory_management/base.html" %}
{% load static %}

{% block title %}Xhard form{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>
  .container { 
    min-height: 90vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  .card {
    padding: 2rem 2rem 3rem 2rem;
    width: 420px;  /* increased width */
    border-radius: 8px;
    box-shadow: 0 4px 10px rgb(0 0 0 / 0.1);
    border: 1px solid #ddd;
    background: #fff;
  }
  .card-logo { 
    display: flex; 
    justify-content: center; 
    margin-bottom: 1rem; 
  }
  .card-title { 
    font-weight: 600; 
    font-size: 1.6rem; 
    text-align: center; 
    margin-bottom: 1.5rem; 
  }
  label {
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 0.25rem;
    display: block;
  }
  
  /* Style inputs and selects to have full width, padding, border radius, etc */
  input, select {
    width: 100% !important;
    max-width: 100%;
    padding: 0.75rem 1rem;  /* bigger padding */
    border-radius: 8px;
    border: 1.5px solid #ccc;
    font-size: 1.2rem;      /* bigger font */
    margin-bottom: 1.5rem;
    box-sizing: border-box;
    appearance: none; /* Remove default dropdown arrow */
    height: 45px;     /* fixed height */
  }
  
  input:focus, select:focus {
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 0 0.15rem rgba(0,123,255,0.25);
  }

  /* Button styles */
  button.btn-danger {
    background-color: #0069d9;
    border: none;
    width: 100%;
    padding: 0.6rem 0;
    font-weight: 600;
    font-size: 1rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button.btn-danger:hover { background-color: #0053ba; }

  /* ======= Fix for Select2 double box issue ======= */
  /* Hide the original select's border when Select2 is active */
  select#id_alpha_number {
    border: none !important;
    padding: 0 !important;
    height: auto !important;
  }

  /* Adjust Select2 container styling */
  .select2-container--default .select2-selection--single {
    border: 1px solid #ccc;
    border-radius: 8px;
    height: 45px;
    padding: 5px 12px;
    font-size: 1.2rem;
    box-sizing: border-box;
  }

  .select2-container--default .select2-selection--single .select2-selection__rendered {
    padding-left: 0;
    padding-right: 0;
    line-height: 35px;
  }

  /* Remove inner arrow padding so dropdown arrow aligns nicely */
  .select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 43px;
    right: 10px;
  }
</style>

<div class="container">
  <div class="card">
    <div class="card-logo">
      <img src="{% static 'images/BoschLogo.png' %}" alt="BOSCH" width="80" />
    </div>
    <div class="card-title">Add Xhard Product</div>
    <form id="exhardForm" method="POST" enctype="multipart/form-data" action="{% url 'exhardForm' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger">Submit</button>
    </form>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"> 
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Confirm Submission</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Do you really want to save the changes?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmSubmitBtn">Yes, Submit</button>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 JS -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- Popper and Bootstrap JS for modal -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
  $(document).ready(function () {
    const alphaSelect = $('#id_alpha_number');

    alphaSelect.select2({
      placeholder: 'Select or search Alpha Number',
      allowClear: true,
      width: '100%'
    });

    // Open Select2 on focus so user doesn't have to click twice
    alphaSelect.on('focus', function () {
      $(this).select2('open');
    });

    // Focus search box immediately after open
    alphaSelect.on('select2:open', function () {
      setTimeout(function () {
        document.querySelector('.select2-container--open .select2-search__field').focus();
      }, 0);
    });

    const form = $('#exhardForm');
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    form.on('submit', function(e) {
      e.preventDefault();  // Prevent immediate form submission
      confirmModal.show();
    });

    $('#confirmSubmitBtn').on('click', function() {
      confirmModal.hide();
      form.off('submit');  // Remove submit handler to prevent recursion
      form.submit();       // Submit the form normally
    });

    // Trigger Yes Submit button when Enter key is pressed inside modal
    $('#confirmModal').on('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('#confirmSubmitBtn').click();
      }
    });
  });
</script>

{% endblock %}
